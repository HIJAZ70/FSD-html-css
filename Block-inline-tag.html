<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>block tags and inline tags</title>
</head>
<body>
    <table border="5px">
       <tr> <th>Block level tags</th></tr>
        <!-- Layout tags -->
       <tr>
        <td>div</td>
        <td>main</td>
        <td>section</td>
        <td>article</td>
        <td>header</td>
        <td>footer</td>
        <td>nav</td>
        <td>aside</td>
        <!-- Text tags -->
         <td>p</td>
         <td>h1 to h6</td>
         <td>blockquote</td>
         <td>pre</td>
         <td>hr</td>
         <!-- list tags -->
          <td>ul</td>
          <td>ol</td>
          <td>li</td>
          <td>dt</td>
          <td>dd</td>
          <!-- other tags -->
           <td>from</td>
           <td>table</td>
           </tr>
           <tr><th>Inline level tags</th></tr>
           <!-- text & style tags -->
          <tr> 
            <td>span</td>
           <td>a</td>
           <td>mark</td>
           <td>del</td>
           <td>ins</td>
           <td>sub</td>
           <td>sup</td>
           <td>strong</td>
           <td>b</td>
           <td>em</td>
           <td>i</td>
           <td>small</td>
           <!-- interactive tags -->
            <td>select</td>
            <td>option</td>
           <!-- form & media tags -->
           <td>img</td>
           <td>audio</td>
           <td>video</td>
           <td>button</td>
           <td>input</td>
           <td>label</td>
           <td>textarea</td>
           <!-- code tag -->
           <td>code</td>
           <td>kbd</td>
           <td>var</td>
           <td>samp</td>
           <!-- bearks tag -->
            <td>br</td>
            <td>wbr</td>
            </tr>

    </table>
</body>
</html>
